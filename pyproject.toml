[project]
name = "email-thread-mcp"
version = "0.3.1"
description = "MCP server for the AR email agent: parses an inbound email thread into the thread contract and validates the agent's output envelope."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "dateparser>=1.2,<2",
    "mcp>=2.3,<3",
]

[project.urls]
Homepage = "https://github.com/OraCool/email-thread-mcp"
Repository = "https://github.com/OraCool/email-thread-mcp"
Issues = "https://github.com/OraCool/email-thread-mcp/issues"
Changelog = "https://github.com/OraCool/email-thread-mcp/releases"

[project.scripts]
email-thread-mcp = "email_thread_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/email_thread_mcp"]

# tests/fixtures (local only, gitignored) holds real customer emails: keep them out of any build.
[tool.hatch.build.targets.sdist]
only-include = ["src/email_thread_mcp", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
